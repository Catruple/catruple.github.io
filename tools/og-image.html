<!doctype html>
<!--
  Plantilla de la imagen de vista previa (Discord, WhatsApp, X…): public/og-image.png, 1200×630.
  Para regenerarla tras cambiarla, desde la raíz del repo (PowerShell):
    & "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe" --headless=new --hide-scrollbars `
      --window-size=1200,630 --virtual-time-budget=5000 `
      --screenshot="$PWD\public\og-image.png" "file:///$($PWD -replace '\\','/')/tools/og-image.html"
-->
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../src/styles/fonts.css">
<style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    body {
        position: relative;
        background:
            linear-gradient(rgb(255 255 255 / .07) 1px, transparent 1px) 0 0 / 40px 40px,
            linear-gradient(90deg, rgb(255 255 255 / .07) 1px, transparent 1px) 0 0 / 40px 40px,
            linear-gradient(rgb(255 255 255 / .14) 2px, transparent 2px) 0 0 / 200px 200px,
            linear-gradient(90deg, rgb(255 255 255 / .14) 2px, transparent 2px) 0 0 / 200px 200px,
            #1b4fd1;
        color: #fff;
        font-family: "Pixelify Sans", monospace;
    }
    /* Regla del borde izquierdo, como en el sitio */
    body::before {
        content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 28px;
        border-right: 1px solid rgb(255 255 255 / .4);
        background:
            repeating-linear-gradient(to bottom, rgb(255 255 255 / .8) 0 2px, transparent 2px 50px) left top / 28px 100% no-repeat,
            repeating-linear-gradient(to bottom, rgb(255 255 255 / .45) 0 1px, transparent 1px 10px) left top / 12px 100% no-repeat;
    }

    .brand { position: absolute; left: 76px; top: 56px; display: flex; align-items: center; gap: 16px;
        font-family: "Silkscreen", monospace; font-weight: 700; font-size: 30px; letter-spacing: .04em; }
    .brand svg { width: 56px; height: 50px; }
    .brand i { font-style: normal; background: #0b0b14; color: #fffcf0; padding: 0 8px; margin-left: 2px; }

    h1 { position: absolute; left: 72px; top: 150px; margin: 0;
        font-family: "Jersey 10", monospace; font-weight: 400; font-size: 104px; line-height: 1.04;
        text-transform: uppercase; text-shadow: 7px 7px 0 #0b0b14; }
    h1 .hl { display: inline-block; margin-top: 10px; padding: 0 18px; color: #0b0b14; text-shadow: none;
        background: #ffd23f; border: 5px solid #0b0b14; box-shadow: 7px 7px 0 #0b0b14; transform: rotate(-2deg); }

    .dim { position: absolute; left: 76px; top: 446px; width: 600px; display: flex; align-items: center; gap: 14px;
        font-family: "Silkscreen", monospace; font-size: 15px; letter-spacing: .1em; color: rgb(255 255 255 / .9); }
    .dim::before, .dim::after { content: ""; flex: 1; height: 16px;
        border-left: 2px solid; border-right: 2px solid;
        background: linear-gradient(currentColor, currentColor) 0 50% / 100% 2px no-repeat; }

    .url { position: absolute; left: 76px; bottom: 54px; font-family: "Jersey 15", monospace; font-size: 40px;
        letter-spacing: .02em; color: #fffcf0; }
    .note { position: absolute; left: 430px; bottom: 56px; font-family: "Caveat", cursive; font-weight: 700;
        font-size: 36px; color: #ffd23f; transform: rotate(-4deg); }

    /* Ventana tipo "Panel de control" */
    .win { position: absolute; right: 60px; top: 132px; width: 330px; background: #fffcf0; color: #0b0b14;
        border: 4px solid #0b0b14; box-shadow: 10px 10px 0 #0b0b14; transform: rotate(2deg); }
    .bar { position: relative; height: 46px; border-bottom: 4px solid #0b0b14;
        background: repeating-linear-gradient(#0b0b14 0 3px, transparent 3px 7px) 0 9px / 100% 28px no-repeat; }
    .bar b { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 0 16px; background: #fffcf0;
        font-family: "Silkscreen", monospace; font-size: 15px; letter-spacing: .04em; white-space: nowrap; }
    .bar i { position: absolute; left: 14px; top: 11px; width: 22px; height: 22px; background: #fffcf0; border: 4px solid #0b0b14; }
    .rows { padding: 18px; display: grid; gap: 12px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 14px;
        border: 3px solid #0b0b14; font-family: "Jersey 15", monospace; font-size: 30px; line-height: 1; }
    .row small { font-family: "Silkscreen", monospace; font-size: 13px; padding: 4px 7px; border: 2px solid #0b0b14; }
    .status { display: flex; justify-content: space-between; padding: 10px 18px; border-top: 4px solid #0b0b14;
        background: #e9e4cf; font-family: "Silkscreen", monospace; font-size: 13px; letter-spacing: .06em; }
</style>
</head>
<body>
    <div class="brand">
        <svg viewBox="0 0 10 9" shape-rendering="crispEdges" aria-hidden="true"><path fill="#fffcf0" d="M0 0h2v1h-2zM8 0h2v1h-2zM0 1h3v1h-3zM7 1h3v1h-3zM0 2h10v1h-10zM0 3h10v1h-10zM0 4h2v1h-2zM3 4h4v1h-4zM8 4h2v1h-2zM0 5h10v1h-10zM0 6h4v1h-4zM6 6h4v1h-4zM1 7h8v1h-8zM2 8h6v1h-6z"/></svg>
        <span>CATRUPLE<i>.COM</i></span>
    </div>

    <h1>Deja de pagar.<br>Software <span class="hl">gratis.</span></h1>

    <div class="dim">Herramientas gratis · sin suscripciones</div>

    <div class="url">catruple.github.io</div>
    <div class="note">código abierto, sin peajes</div>

    <div class="win">
        <div class="bar"><i></i><b>PANEL DE CONTROL</b></div>
        <div class="rows">
            <div class="row">Sistema <small>WIN</small></div>
            <div class="row">Utilidades <small>FREE</small></div>
            <div class="row">Scripts <small>OSS</small></div>
            <div class="row">Guías <small>ES/EN</small></div>
        </div>
        <div class="status"><span>■ ESTADO: OPERATIVO</span><span>$0</span></div>
    </div>
</body>
</html>
